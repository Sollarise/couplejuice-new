<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Get the Free Couple Vlog Starter Kit — Couplejuice</title>
  <meta
    name="description"
    content="Download the free 7-Day Couple Vlog Starter Kit: prompts, shot lists, and editing tips to help you create videos together."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --clr-bg-start: #fff4ec;
      --clr-bg-end: #ffe3d3;
      --clr-text-primary: #2d1f1a;
      --clr-text-secondary: #6b5147;
      --clr-accent: #e85d3d;
      --clr-accent-hover: #cf4a2d;
      --clr-white: #ffffff;
      --clr-error: #b3261e;
      --ff-heading: "Fraunces", Georgia, serif;
      --ff-body: "Inter", system-ui, -apple-system, sans-serif;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --space-xl: 4rem;
      --radius: 12px;
      --shadow: 0 8px 30px rgba(45, 31, 26, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      font-family: var(--ff-body);
      color: var(--clr-text-primary);
      line-height: 1.6;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-md);
      background: linear-gradient(160deg, var(--clr-bg-start) 0%, var(--clr-bg-end) 100%);
    }

    .squeeze-card {
      width: 100%;
      max-width: 560px;
      background: var(--clr-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--space-xl) var(--space-lg);
      text-align: center;
    }

    .brand {
      font-family: var(--ff-heading);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--clr-accent);
      margin-bottom: var(--space-lg);
    }

    .headline {
      font-family: var(--ff-heading);
      font-weight: 700;
      font-size: clamp(1.75rem, 4vw + 1rem, 2.75rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
    }

    .headline em {
      font-style: normal;
      color: var(--clr-accent);
    }

    .subheadline {
      font-size: 1.05rem;
      color: var(--clr-text-secondary);
      max-width: 42ch;
      margin: 0 auto var(--space-lg);
    }

    .preview {
      background: linear-gradient(135deg, #fff4ec, #ffe3d3);
      border: 1px dashed rgba(232, 93, 61, 0.35);
      border-radius: var(--radius);
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      text-align: left;
    }

    .preview-icon {
      width: 48px;
      height: 48px;
      background: var(--clr-accent);
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--clr-white);
      font-size: 1.5rem;
    }

    .preview-text strong {
      display: block;
      font-size: 0.95rem;
      color: var(--clr-text-primary);
    }

    .preview-text span {
      font-size: 0.85rem;
      color: var(--clr-text-secondary);
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--clr-text-primary);
    }

    input[type="email"] {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem var(--space-sm);
      font-family: var(--ff-body);
      font-size: 1rem;
      color: var(--clr-text-primary);
      background: var(--clr-white);
      border: 1.5px solid #d9c8c0;
      border-radius: 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--clr-accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 61, 0.2);
    }

    input[type="email"]:invalid:not(:placeholder-shown) {
      border-color: var(--clr-error);
    }

    .cta-button {
      width: 100%;
      min-height: 52px;
      padding: var(--space-sm) var(--space-md);
      font-family: var(--ff-body);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--clr-white);
      background: var(--clr-accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .cta-button:hover { background: var(--clr-accent-hover); }
    .cta-button:active { transform: scale(0.98); }

    .cta-button:focus-visible {
      outline: 3px solid var(--clr-text-primary);
      outline-offset: 2px;
    }

    .privacy-note {
      font-size: 0.8rem;
      color: var(--clr-text-secondary);
      text-align: center;
      margin-top: var(--space-xs);
    }

    .blog-link {
      margin-top: var(--space-md);
      font-size: 0.85rem;
      color: var(--clr-text-secondary);
    }

    .blog-link a {
      color: var(--clr-accent);
      text-decoration: none;
      font-weight: 600;
    }

    .blog-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 400px) {
      .squeeze-card { padding: var(--space-lg) var(--space-md); }
    }
  </style>
</head>
<body>

  <main class="squeeze-card">
    <div class="brand">Couplejuice</div>

    <h1 class="headline">
      Get the <em>7-Day Couple Vlog Starter Kit</em>
    </h1>

    <p class="subheadline">
      The exact prompts, shot lists, and editing tips we use to create videos
      together — free for you.
    </p>

    <div class="preview" aria-hidden="true">
      <div class="preview-icon">📘</div>
      <div class="preview-text">
        <strong>Free PDF + Notion Template</strong>
        <span>24 pages · Instant download</span>
      </div>
    </div>

    <!--
      FORM:
      - Replace YOUR_FORM_ID with your Formspree form ID.
      - The _next hidden input redirects to /thanks.html after submission.
    -->
    <form
      class="signup-form"
      action="https://formspree.io/f/YOUR_FORM_ID"
      method="POST"
    >
      <div class="form-group">
        <label for="email">Your best email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
          autocomplete="email"
          spellcheck="false"
          aria-describedby="privacy-note"
        />
      </div>

      <!-- Redirect after successful submission -->
      <input type="hidden" name="_next" value="https://couplejuice.com/thanks.html" />

      <button type="submit" class="cta-button">
        Yes, Send Me the Free Kit
      </button>

      <p class="privacy-note" id="privacy-note">
        No spam. Unsubscribe anytime.
      </p>
    </form>

    <p class="blog-link">
      Already have it? <a href="/blog/">Read the blog →</a>
    </p>
  </main>

</body>
</html>
